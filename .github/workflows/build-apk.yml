name: Build AutoClipper AI v6

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          echo "=== ROOT ==="
          ls -la

          echo "=== APP ==="
          ls -la app

          echo "=== MAIN ==="
          ls -la app/src/main

          echo "=== BUILD FILES ==="
          test -f settings.gradle && echo "settings.gradle OK"
          test -f build.gradle && echo "build.gradle OK"
          test -f app/build.gradle && echo "app/build.gradle OK"
          test -f app/src/main/AndroidManifest.xml && echo "AndroidManifest.xml OK"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check Gradle
        run: |
          gradle --version

      - name: Build Debug APK
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Check APK
        run: |
          echo "=== APK ==="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClipperAI-v6-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
